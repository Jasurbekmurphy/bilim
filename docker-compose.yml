services:
  web:
    build: .
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
    ports:
      # Faqat shu serverning o'zidan ochiq; tashqariga Caddy yoki mavjud nginx orqali chiqadi
      - "127.0.0.1:${WEB_PORT:-8100}:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Telegram bot: akkauntni ulash (/start). Token berilmasa jim turadi.
  bot:
    build: .
    command: ["python", "bot.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ./data:/data
    depends_on:
      - web
    restart: unless-stopped

  # Serverda boshqa nginx bo'lmasa ishlatiladi (install.sh COMPOSE_PROFILES=caddy qo'yadi).
  # Tashqi so'rovlarni qabul qiladi; domen berilsa HTTPS sertifikatini o'zi oladi
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
