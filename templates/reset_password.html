{% extends "base.html" %}
{% block title %}Yangi parol · Bilimlar manbai{% endblock %}
{% block content %}
<div class="card narrow">
  <img class="i3d lg card-icon" src="{{ url_for('static', filename='icons/key.webp') }}" alt="">
  <h1>Yangi parol</h1>
  <p class="muted">Telegramga kelgan 6 xonali kodni va yangi parolni kiriting.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Kod <input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autofocus autocomplete="one-time-code" style="letter-spacing:.5em;font-size:20px;text-align:center"></label>
    <label>Yangi parol <input name="new" type="password" minlength="6" required autocomplete="new-password"></label>
    <label>Yangi parolni takrorlang <input name="new2" type="password" minlength="6" required autocomplete="new-password"></label>
    <button class="btn" style="width:100%">Parolni yangilash</button>
  </form>
  <div class="form-foot" style="margin-top:14px"><a class="small" href="{{ url_for('forgot_password') }}">Kod kelmadimi? Qayta yuborish</a></div>
</div>
{% endblock %}
