{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <img class="i3d lg card-icon" src="{{ url_for('static', filename='icons/lock.webp') }}" alt="">
  <h1>Parolni o'zgartirish</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Joriy parol <input name="old" type="password" required></label>
    <label>Yangi parol <input name="new" type="password" minlength="6" required></label>
    <label>Yangi parolni takrorlang <input name="new2" type="password" minlength="6" required></label>
    <button class="btn">Saqlash</button>
  </form>
</div>
{% endblock %}
