{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Tizimga kirish</h1>
  <p class="muted">Login va parolni texnikum administratori beradi.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Login <input name="username" required autofocus></label>
    <label>Parol <input name="password" type="password" required></label>
    <button class="btn">Kirish</button>
  </form>
</div>
{% endblock %}
